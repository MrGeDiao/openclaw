services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      TZ: ${OPENCLAW_TZ:-UTC}
      OPENCLAW_HOME: ${OPENCLAW_HOME:-/home/node}
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_LOG_DIR: ${OPENCLAW_LOG_DIR:-/home/node/.openclaw/agents}
      PATH: ${PATH:-/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}
      PI_BASH_YIELD_MS: ${PI_BASH_YIELD_MS:-120000}
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      OPENCLAW_OWNER_DISPLAY_SECRET: ${OPENCLAW_OWNER_DISPLAY_SECRET:-}
      OPENCLAW_CODEX_API_KEY: ${OPENCLAW_CODEX_API_KEY:-}
      OPENCLAW_CODEX_BASE_URL: ${OPENCLAW_CODEX_BASE_URL:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_WIFE_APP_ID: ${FEISHU_WIFE_APP_ID:-}
      FEISHU_WIFE_APP_SECRET: ${FEISHU_WIFE_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      WHATSAPP_ALLOWED_FROM: ${WHATSAPP_ALLOWED_FROM}
      TELEGRAM_ALLOWED_FROM: ${TELEGRAM_ALLOWED_FROM}
      DISCORD_ALLOWED_FROM: ${DISCORD_ALLOWED_FROM}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - ${OPENCLAW_WIFE_WORKSPACE_DIR}:/home/node/.openclaw/workspace-longxia-wife
      - /home/node/.acpx:/home/node/.acpx
      ## Uncomment the lines below to enable sandbox isolation
      ## (agents.defaults.sandbox). Requires Docker CLI in the image
      ## (build with --build-arg OPENCLAW_INSTALL_DOCKER_CLI=1) or use
      ## scripts/docker/setup.sh with OPENCLAW_SANDBOX=1 for automated setup.
      ## Set DOCKER_GID to the host's docker group GID (run: stat -c '%g' /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    network_mode: host
    init: true
    restart: unless-stopped
    dns:
      - ${OPENCLAW_GATEWAY_DNS_1:-1.1.1.1}
      - ${OPENCLAW_GATEWAY_DNS_2:-8.8.8.8}
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      TZ: ${OPENCLAW_TZ:-UTC}
      OPENCLAW_HOME: ${OPENCLAW_HOME:-/home/node}
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_LOG_DIR: ${OPENCLAW_LOG_DIR:-/home/node/.openclaw/agents}
      PATH: ${PATH:-/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}
      PI_BASH_YIELD_MS: ${PI_BASH_YIELD_MS:-120000}
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      OPENCLAW_OWNER_DISPLAY_SECRET: ${OPENCLAW_OWNER_DISPLAY_SECRET:-}
      OPENCLAW_CODEX_API_KEY: ${OPENCLAW_CODEX_API_KEY:-}
      OPENCLAW_CODEX_BASE_URL: ${OPENCLAW_CODEX_BASE_URL:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_WIFE_APP_ID: ${FEISHU_WIFE_APP_ID:-}
      FEISHU_WIFE_APP_SECRET: ${FEISHU_WIFE_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      WHATSAPP_ALLOWED_FROM: ${WHATSAPP_ALLOWED_FROM}
      TELEGRAM_ALLOWED_FROM: ${TELEGRAM_ALLOWED_FROM}
      DISCORD_ALLOWED_FROM: ${DISCORD_ALLOWED_FROM}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - ${OPENCLAW_WIFE_WORKSPACE_DIR}:/home/node/.openclaw/workspace-longxia-wife
      - /home/node/.acpx:/home/node/.acpx
    stdin_open: true
    tty: true
    init: true
    dns:
      - ${OPENCLAW_GATEWAY_DNS_1:-1.1.1.1}
      - ${OPENCLAW_GATEWAY_DNS_2:-8.8.8.8}
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway
